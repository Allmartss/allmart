name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Pull & restart on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/allmart
            git pull origin main
            bash deploy.sh
            sudo systemctl restart allmart
            sleep 5
            curl -fsS http://localhost:8080/api/healthz \
              || { echo "Health check failed"; sudo systemctl stop allmart; exit 1; }
            echo "Deploy complete ✓"

      - name: Notify email (success)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          secure:         true
          to:             help@allmart.us
          from:           AllMart CI <${{ secrets.SMTP_USER }}>
          subject:        "✅ AllMart deployed — ${{ github.ref_name }}"
          body: |
            Deployment succeeded.

            Branch : ${{ github.ref_name }}
            Commit : ${{ github.sha }}
            Author : ${{ github.actor }}
            Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify email (failure)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          secure:         true
          to:             help@allmart.us
          from:           AllMart CI <${{ secrets.SMTP_USER }}>
          subject:        "❌ AllMart deploy FAILED — ${{ github.ref_name }}"
          body: |
            Deployment failed — action required.
            
            Branch : ${{ github.ref_name }}
            Commit : ${{ github.sha }}
            Author : ${{ github.actor }}
            Logs   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
